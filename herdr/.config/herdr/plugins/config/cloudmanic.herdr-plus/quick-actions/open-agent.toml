name = "🤖 Open Agent"
description = "Open agent at the current directory"
type = "command"
command = '''
pane="$(${HERDR_BIN_PATH:-herdr} tab create --label agent --focus --cwd "{{.WorkDir}}" \
  | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get(\"result\", d); print(r[\"root_pane\"][\"pane_id\"])")"
${HERDR_BIN_PATH:-herdr} pane run "$pane" agent
'''
